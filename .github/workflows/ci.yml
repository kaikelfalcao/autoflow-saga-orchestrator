name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Lint + Test + Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saga_user
          POSTGRES_PASSWORD: saga_pass
          POSTGRES_DB: saga
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_USER: saga_user
      DATABASE_PASSWORD: saga_pass
      DATABASE_NAME: saga
      RABBITMQ_URL: amqp://admin:admin@localhost:5672
      ORDER_SERVICE_URL: http://localhost:3001
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test:cov
      - run: npm run test:bdd --if-present

      # TODO: integrar SonarQube Community Edition (self-hosted) para emitir relatórios.
      # SonarCloud removido temporariamente — voltar com `sonar-scanner` apontando para a instância community.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
